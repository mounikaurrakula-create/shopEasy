<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <style>
        body{font-family:Arial;background:#f5f5f5;margin:0}
        nav{background:#222;color:white;padding:20px 5%;display:flex;justify-content:space-between}
        nav a{color:white;margin-left:20px;text-decoration:none}
        .box{max-width:800px;margin:50px auto;background:white;padding:30px;border-radius:15px;text-align:center}
        img{width:350px;height:350px;object-fit:contain}
        h1{font-size:30px}
        .price{font-size:25px;color:#087cff;font-weight:bold}
        .btn{display:inline-block;background:#087cff;color:white;padding:12px 25px;text-decoration:none;border-radius:7px}
    </style>
</head>

<body>

<nav>
    <b>Mounika mart</b>
    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'products' %}">Products</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
    </div>
</nav>

<div class="box">

    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    {% endif %}

    <h1>{{ product.name }}</h1>

    <p>{{ product.description|default:"No description available." }}</p>

    <p class="price">₹{{ product.price }}</p>

    <a class="btn" href="{% url 'add_to_cart' product.id %}">
         Add to Cart
    </a>

</div>

</body>
</html>
